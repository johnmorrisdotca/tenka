<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Tenka · conquest table</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}</style></head><body><script type="module">
import "../dist/element-define.js";
import { embedDay } from "../dist/embed-day.js";
const query=new URLSearchParams(location.search),table=document.createElement("tenka-table");table.setAttribute("size","medium");table.setAttribute("record","false");
for(const[name,choices]of[["map",["world","europe"]],["rounds",["10","20","60"]],["computers",["all","none"]],["lang",["en","ja"]],["theme",["auto","light","dark"]],["size",["small","medium","large"]]])if(choices.includes(query.get(name)))table.setAttribute(name,query.get(name));
const computers=query.get("computers");if(computers!==null&&/^(true|false|on|off|1|0|no|yes|computer)(,(true|false|on|off|1|0|no|yes|computer)){1,5}$/.test(computers))table.setAttribute("computers",computers);
for(const[name,min,max]of[["width",100,2000],["seed",0,4294967295],["seats",2,6],["delay",0,60000]]){const value=query.get(name);if(value!==null&&/^\d+$/.test(value)&&Number(value)>=min&&Number(value)<=max)table.setAttribute(name,value);}if(query.get("seed")==="daily")table.setAttribute("seed","daily");
if(query.has("daily"))try{embedDay(query.get("daily"));table.setAttribute("daily",query.get("daily"));}catch{/* Ignore an invalid day. */}
if(query.has("record")&&["","true","on","1","false","off","no","0"].includes(query.get("record").trim().toLowerCase()))table.setAttribute("record",query.get("record"));const label=query.get("label");if(label!==null&&label.length<=200)table.setAttribute("label",label);if(query.get("lang")==="ja")document.documentElement.lang="ja";
for(const type of["tenka-load","tenka-change","tenka-finish","tenka-error"])table.addEventListener(type,event=>{if(parent!==window)parent.postMessage({type:event.type,detail:JSON.parse(JSON.stringify(event.detail))},"*");});document.body.append(table);
</script></body></html>
